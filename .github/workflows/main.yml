name: Kalshi Paper Trading Daemon

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes automatically
  workflow_dispatch:

jobs:
  run-daemon:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to allow the workflow to commit files back to the repo
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pandas

      - name: Run Daemon Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daemon.py

      - name: Commit and Push CSV Log Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kalshi_flexible_paper_log.csv || true
          git commit -m "chore: update paper trading log [skip ci]" || echo "No changes to commit"
          git push
